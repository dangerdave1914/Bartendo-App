<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar ordering prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Serif+Display&family=Work+Sans:wght@400;600;700&family=Permanent+Marker&family=Archivo:wght@400;600;800&family=Italiana&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EDE2; --panel:#FBF8F1; --line:#D9D0BD; --text:#1D2B27; --muted:#5E6B64;
  --accent:#1E4A40; --on-accent:#FBF8F1; --brass:#8E6A1F; --cherry:#B23A2E; --ok:#2F6B4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10261F; --panel:#173329; --line:#2A4A3F; --text:#ECE4D2; --muted:#9FB5AA;
  --accent:#D6AE5E; --on-accent:#10261F; --brass:#D6AE5E; --cherry:#E0685B; --ok:#7CC39B;}}
:root[data-theme="dark"]{
  --bg:#10261F; --panel:#173329; --line:#2A4A3F; --text:#ECE4D2; --muted:#9FB5AA;
  --accent:#D6AE5E; --on-accent:#10261F; --brass:#D6AE5E; --cherry:#E0685B; --ok:#7CC39B;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem 1.25rem;flex-wrap:wrap;
  padding:1rem 1.25rem .75rem;max-width:1200px;margin:0 auto}
.top h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em}
.venues{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.venues span{color:var(--muted);font-size:.9rem;margin-right:.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 1rem}
.chips button,.venues button{padding:.45rem .8rem;border-radius:99px;border:1px solid var(--line);background:none}
.chips button[aria-pressed="true"],.venues button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.clock{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tabs{display:none;gap:.25rem;padding:0 1.25rem .75rem;max-width:1200px;margin:0 auto}
.tabs button{flex:1;padding:.6rem;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge{display:inline-block;min-width:1.3em;padding:0 .35em;margin-left:.35em;border-radius:99px;background:var(--cherry);color:#fff;font-size:.8em}
.panes{display:grid;grid-template-columns:400px 1fr;grid-template-areas:"patron bar" "patron venue";
  gap:1.25rem;padding:0 1.25rem 2rem;max-width:1200px;margin:0 auto;align-items:start}
.pane{min-width:0}
[data-pane="patron"]{grid-area:patron;position:sticky;top:1rem}
[data-pane="bar"]{grid-area:bar}
[data-pane="venue"]{grid-area:venue}
@media (max-width:900px){
  .tabs{display:flex}
  .panes{grid-template-columns:1fr;grid-template-areas:none}
  .pane{grid-area:auto !important;position:static !important;display:none}
  .pane.active{display:block}
}
h2{font-size:1.6rem;line-height:1.1;margin:.25rem 0 .5rem;font-weight:800;letter-spacing:-.015em}
h3{font-size:1.05rem;margin:0 0 .5rem;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem}

/* ---------- Patron phone: everything below reads from the venue theme (--t-*) ---------- */
.phone{position:relative;overflow:hidden;background:var(--t-bg);color:var(--t-text);font-family:var(--t-body);
  border-radius:32px;border:1px solid var(--line);min-height:680px;display:flex;flex-direction:column;
  padding:1.1rem 1.1rem 1.2rem;background-image:var(--t-bgimg);transition:background-color .4s}
.phone *{border-color:var(--t-line)}
.p-head{display:flex;justify-content:space-between;font-size:.8rem;color:var(--t-muted);margin-bottom:.5rem;position:relative;z-index:1}
.p-body{display:flex;flex-direction:column;flex:1;position:relative;z-index:1}
.phone h2{font-family:var(--t-display);font-weight:400;font-size:2.1rem;letter-spacing:0;line-height:1.05;margin:.2rem 0 .6rem}
.phone h3{font-family:var(--t-body);font-weight:600;font-size:.95rem;color:var(--t-muted)}
.p-muted{color:var(--t-muted)}
.p-btn{display:block;width:100%;padding:.95rem 1rem;border:0;border-radius:var(--t-radius);background:var(--t-accent);color:var(--t-on);
  font-weight:700;font-size:1.05rem;font-family:var(--t-body)}
.p-btn:disabled{opacity:.4;cursor:not-allowed}
.p-link{background:none;border:0;padding:0;text-decoration:underline;color:var(--t-muted);font-family:var(--t-body)}
.p-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.25rem 0 1rem}
.p-chips button{padding:.45rem .85rem;border-radius:var(--t-radius);border:1px solid var(--t-line);background:none;font-family:var(--t-body)}
.p-chips button[aria-pressed="true"]{background:var(--t-accent);color:var(--t-on);border-color:var(--t-accent)}
.hero{margin:0 -1.1rem 1rem;padding:1.4rem 1.1rem 1.2rem;position:relative}
.hero .kind{font-size:.85rem;color:var(--t-muted)}
.hero .vname{font-family:var(--t-display);font-size:3rem;line-height:.95;margin:.3rem 0 .5rem;overflow-wrap:anywhere}
.hero p{margin:0;color:var(--t-muted);max-width:30ch}
.idcard{background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-radius);padding:.9rem;margin:.25rem 0 1rem;
  display:grid;grid-template-columns:52px 1fr;gap:.8rem;align-items:center}
.idcard .face{width:52px;height:66px;border-radius:6px;background:linear-gradient(160deg,#c8bca3,#8d8069)}
.idcard b{display:block;font-size:1.1rem}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;margin-top:.25rem}
.pill.ok{background:color-mix(in srgb,#3FA46A 22%,transparent);color:color-mix(in srgb,#3FA46A 70%,var(--t-text))}
.pill.no{background:color-mix(in srgb,#E0453A 22%,transparent);color:color-mix(in srgb,#E0453A 75%,var(--t-text))}
.p-notice{border-left:3px solid #E0453A;padding:.5rem .75rem;margin:.75rem 0;background:color-mix(in srgb,#E0453A 12%,transparent);border-radius:0 8px 8px 0;font-size:.92rem}
.p-notice.good{border-color:var(--t-accent);background:color-mix(in srgb,var(--t-accent) 18%,transparent)}
.menu{list-style:none;margin:0 0 1rem;padding:0;flex:1}
.menu li{display:grid;grid-template-columns:46px 1fr auto;gap:.8rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--t-line)}
.menu li.off{opacity:.35}
.menu .name{font-weight:700;font-size:1.02rem}
.menu .ing{font-size:.8rem;color:var(--t-muted);line-height:1.3}
.menu .price{font-size:.88rem;font-variant-numeric:tabular-nums;margin-top:.1rem}

/* Upgraded 3D-shaded glass icons */
.glass{
  --c:#ccc;
  position:relative;
  overflow:hidden;
  width:28px;
  height:42px;
  margin:0 auto;
  border:1.5px solid rgba(255,255,255,.35);
  border-top:0;
  border-radius:0 0 6px 6px;
  background:linear-gradient(90deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.03) 35%, rgba(0,0,0,.18) 100%);
  box-shadow:inset 0 -3px 6px rgba(0,0,0,.35), 0 4px 8px rgba(0,0,0,.22);
}
.glass::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:74%;
  background:
    linear-gradient(90deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.05) 30%, rgba(0,0,0,.35) 100%),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, #fff) 0%, var(--c) 30%, color-mix(in srgb, var(--c) 65%, #000) 100%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.5);
}
.glass::before{
  content:"";
  position:absolute;
  top:2px;bottom:3px;left:4px;
  width:3px;
  border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.05));
  z-index:2;
  pointer-events:none;
}
.glass.can::after{height:100%}
.glass.rocks{width:36px;height:30px;border-radius:0 0 8px 8px}
.glass.pint{width:28px;height:46px;border-radius:0 0 4px 4px;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.glass.coupe{width:42px;height:22px;border-radius:0 0 50% 50%}
.glass.wine{width:34px;height:30px;border-radius:0 0 50% 50%}
.glass.flute{width:18px;height:46px;border-radius:0 0 9px 9px}
.glass.shot{width:22px;height:26px;border-radius:0 0 3px 3px}
.glass.can{width:26px;height:42px;border-top:1.5px solid rgba(255,255,255,.45);border-radius:5px}

.stepper{display:flex;align-items:center;gap:.4rem}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--t-line);background:none;font-weight:700}
.stepper button:last-child{background:var(--t-accent);color:var(--t-on);border-color:var(--t-accent)}
.stepper button:disabled{opacity:.4}
.stepper span{min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.rows{margin:.5rem 0 1rem}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;font-variant-numeric:tabular-nums}
.row.total{border-top:1px solid var(--t-line);margin-top:.3rem;padding-top:.6rem;font-weight:800;font-size:1.1rem}
.ticket{background:var(--t-ticket);color:var(--t-ticket-ink);border-radius:var(--t-radius);padding:1.4rem 1.2rem 1.2rem;margin:.5rem 0 1rem;
  -webkit-mask:radial-gradient(circle 11px at 0 64%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 64%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .num{font-size:.9rem;opacity:.75;font-variant-numeric:tabular-nums}
.ticket .who{font-family:var(--t-display);font-size:2.8rem;line-height:1;margin:.25rem 0 .8rem;overflow-wrap:anywhere}
.ticket .tear{border-top:2px dashed currentColor;opacity:.35;margin:1rem -1.2rem .9rem}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:.35rem;font-size:.95rem}
.steps li{display:flex;gap:.6rem;align-items:center;opacity:.4}
.steps li.done,.steps li.now{opacity:1}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;flex:none}
.steps li.done::before{background:currentColor}
.steps li.now::before{background:var(--t-accent);border-color:var(--t-accent)}

/* Venue signatures */
[data-venue="agave"] .hero{padding-top:2.6rem}
[data-venue="agave"] .hero::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;
  background:repeating-linear-gradient(90deg,#E4572E 0 48px,#F2B632 48px 96px,#2EC4B6 96px 144px,#F25F8B 144px 192px);
  -webkit-mask:radial-gradient(circle 9px at 12px 100%,transparent 96%,#000) 0 0/24px 100%;mask:radial-gradient(circle 9px at 12px 100%,transparent 96%,#000) 0 0/24px 100%}
[data-venue="dive"] .phone h2,[data-venue="dive"] .hero .vname{transform:rotate(-2deg);transform-origin:left}
[data-venue="dive"] .hero{border-bottom:3px solid var(--t-text);margin-bottom:1.2rem}
[data-venue="dive"] .ticket .who{transform:rotate(-2deg)}
[data-venue="roof"] .idcard,[data-venue="roof"] .p-notice{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
[data-venue="roof"] .hero{padding-bottom:3.4rem}
[data-venue="roof"] .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(10,8,30,.55);
  clip-path:polygon(0 100%,0 60%,6% 60%,6% 30%,12% 30%,12% 55%,18% 55%,18% 10%,22% 10%,22% 50%,30% 50%,30% 35%,36% 35%,36% 70%,44% 70%,44% 20%,48% 0,52% 20%,52% 60%,60% 60%,60% 40%,68% 40%,68% 65%,74% 65%,74% 25%,80% 25%,80% 55%,88% 55%,88% 38%,94% 38%,94% 62%,100% 62%,100% 100%)}
@media (prefers-reduced-motion:no-preference){
  .phone .p-body{animation:enter .45s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}}
  .ticket.ready{animation:ring 1.6s ease-in-out infinite}
  @keyframes ring{50%{filter:drop-shadow(0 0 14px var(--t-accent))}}
}

/* Arrival scene */
.phone-wrap{position:relative}
.arrival{position:absolute;inset:0;border-radius:32px;overflow:hidden;background:#000;z-index:5;transition:opacity .6s ease}
.arrival[hidden]{display:none}
.arrival.out{opacity:0;pointer-events:none}
.arrival canvas{display:block;width:100%;height:100%}
.a-text{position:absolute;left:0;right:0;bottom:0;padding-bottom:22%!important;padding-top:4rem!important;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.35) 55%,transparent);text-align:center;padding:0 1.2rem;color:#fff;opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.a-text.show{opacity:1;transform:none}
.a-kind{font-size:.9rem;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.a-name{font-size:3.2rem;line-height:.95;margin-top:.35rem;overflow-wrap:anywhere}
.a-skip{position:absolute;top:14px;right:14px;z-index:2;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.35rem .85rem;font-size:.8rem}
[data-a-venue="agave"] .a-name{color:#FFF4DF;text-shadow:0 3px 20px rgba(0,0,0,.7), 0 0 30px rgba(242,182,50,.45)}
[data-a-venue="dive"] .a-name{color:#ffe6e8;text-shadow:0 0 6px #ff4455,0 0 18px #ff2a40,0 0 40px #c8201e;transform:rotate(-3deg)}
[data-a-venue="roof"] .a-name{color:#FFF4E6;letter-spacing:.02em;text-shadow:0 3px 24px rgba(15,10,35,.85), 0 0 28px rgba(245,194,139,.4)}
@media (prefers-reduced-motion:no-preference){
  .glass.pour::after{animation:pour .7s cubic-bezier(.3,.7,.3,1)}
  @keyframes pour{from{height:0}}
  [data-a-venue="dive"] .a-text.show .a-name{animation:neon 2.4s steps(1) 1}
  @keyframes neon{0%{opacity:.2}8%{opacity:1}12%{opacity:.3}18%{opacity:1}22%{opacity:.5}26%,100%{opacity:1}}
}

/* ---------- Operator side (bar + venue) stays neutral ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem}
.bar-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
@media (max-width:640px){.board{grid-template-columns:1fr}}
.col h3{display:flex;justify-content:space-between;color:var(--muted);font-weight:600;font-size:.95rem}
.order{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.75rem;margin-bottom:.6rem}
.order .who{font-weight:800;font-size:1.2rem;line-height:1.1}
.order ul{margin:.4rem 0;padding-left:1.1rem;font-size:.92rem}
.order .meta{font-size:.8rem;color:var(--muted)}
.order button{margin-top:.5rem;width:100%;padding:.55rem;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.order button:disabled{opacity:.4;cursor:not-allowed}
.order label{display:flex;gap:.5rem;align-items:center;font-size:.9rem;margin-top:.4rem}
.empty{color:var(--muted);font-size:.9rem;padding:.5rem 0}
.card .row{border-color:var(--line)}
.field{display:grid;gap:.3rem;margin-bottom:1rem}
.field select{padding:.5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.meter{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:.4rem 0}
.meter i{display:block;height:100%;background:var(--brass)}
/* Drink renderer + photo ingest */
.menu .gwrap{display:flex;justify-content:center;align-items:flex-end;height:60px}
.menu .gwrap .drink-svg{width:46px;height:58px;overflow:visible}
.menu .name button{all:unset;cursor:pointer;font-weight:700}
.menu .name button:focus-visible{outline:2px solid var(--t-accent);outline-offset:2px}
.menu .spec-tag{display:inline-block;margin-left:.35rem;font-size:.68rem;font-weight:600;padding:.05rem .4rem;border-radius:99px;background:var(--t-accent);color:var(--t-on);vertical-align:2px}
.dsheet{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:1.1rem;background:var(--t-bg);background-image:var(--t-bgimg);color:var(--t-text);font-family:var(--t-body);border-radius:32px}
.dsheet .kind{font-size:.8rem;color:var(--t-accent);font-weight:600}
.dsheet h2{font-family:var(--t-display);font-weight:400;font-size:2rem;line-height:1.05}
.dclose{align-self:flex-end}
.dstage{display:flex;justify-content:center;padding:.4rem 0 .6rem;perspective:600px}
.dstage .drink-svg{overflow:visible;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.realphoto summary{cursor:pointer;color:var(--t-muted);font-size:.9rem;margin-bottom:.4rem}
.realphoto img{width:100%;max-height:180px;object-fit:cover;border-radius:var(--t-radius);margin-bottom:.8rem}
.ingest .field input:not([type=color]){padding:.5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;width:100%}
.ing-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0 .75rem}
.ing-compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.75rem;margin-bottom:1rem}
.ing-compare figure{margin:0;background:#191524;border-radius:12px;padding:.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px}
.ing-compare img{width:100%;max-height:200px;object-fit:contain;border-radius:8px}
.ing-compare figcaption{color:#cfc6dc;font-size:.8rem;margin-top:.4rem}
.ing-render .drink-svg{overflow:visible}
.ing-thumb{display:block;max-width:180px;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:.75rem}
.ing-swatches{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.ing-swatches input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.filebtn{display:inline-block;padding:.45rem .8rem;border-radius:99px;border:1px solid var(--line);cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--brass)}
.chips .primary-chip{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.notice{border-left:3px solid var(--cherry);padding:.5rem .75rem;margin:.5rem 0;background:color-mix(in srgb,var(--cherry) 10%,transparent);border-radius:0 8px 8px 0;font-size:.92rem}
.venue-full{grid-column:1/-1;border-top:1px solid var(--line);margin-top:.5rem;padding-top:1rem}
@media (prefers-reduced-motion:no-preference){
  .drink-svg .ice{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(2.5px)}}
  .drink-svg .bub{animation:rise 2.4s linear infinite}
  @keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(var(--rise));opacity:0}}
  .drink-svg .smoke path{animation:smoke 3.3s ease-out infinite;opacity:0}
  @keyframes smoke{0%{opacity:0;transform:translateY(6px)}30%{opacity:.35}100%{opacity:0;transform:translateY(-22px) scaleX(1.4)}}
  .drink-svg.live{animation:turn 6s ease-in-out infinite;transform-style:preserve-3d}
  @keyframes turn{0%,100%{transform:rotateY(-14deg) translateY(0)}50%{transform:rotateY(14deg) translateY(-6px)}}
  .dsheet{animation:sheet .35s ease-out}
  @keyframes sheet{from{transform:translateY(24px);opacity:0}}
}
.venue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 1.5rem}
.swatches{display:flex;gap:.35rem;margin:.3rem 0 .8rem}
.swatches i{width:26px;height:26px;border-radius:6px;border:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <h1>Bar ordering prototype</h1>
  <div class="venues" id="venues"></div>
  <span class="clock" id="clock"></span>
</header>
<nav class="tabs" id="tabs" aria-label="Views"></nav>
<main class="panes">
  <section class="pane" data-pane="patron" aria-label="Patron app"><div class="phone-wrap"><div class="phone" id="patron"></div><div class="arrival" id="arrival" hidden></div></div></section>
  <section class="pane" data-pane="bar" aria-label="Bartender queue"><div class="card" id="bar"></div></section>
  <section class="pane" data-pane="venue" aria-label="Venue settings"><div class="card" id="venue"></div></section>
</main>
<script>
/* Each venue = settings + staff + menu + a theme. The app logic below never changes between venues. */
const VENUES=[
 {key:'agave',name:'Casa Agave',kind:'Tequila and mezcal bar',tagline:'Tequila, mezcal, and a patio that stays open late.',
  staff:['Lupe','Marco','Dani'],paceMin:30,perOrder:2,feeModel:'patron',cap:150,feesThisMonth:112,
  theme:{display:"'DM Serif Display',Georgia,serif",body:"'Work Sans',system-ui,sans-serif",bg:'#17285A',surface:'#21356E',text:'#FBF1DC',
   muted:'#B9C2DE',line:'#34498A',accent:'#F2B632',on:'#17285A',ticket:'#FBF1DC',ticketInk:'#17285A',radius:'6px',bgimg:'none'},
  menu:[
   {id:'pal',name:'Paloma',price:11,color:'#F0A69C',ing:'Blanco tequila, grapefruit, lime, salted rim',glass:''},
   {id:'mar',name:'Casa Margarita',price:12,color:'#D6CF6E',ing:'Reposado, orange liqueur, fresh lime, tajín rim',glass:'rocks'},
   {id:'mng',name:'Mezcal Negroni',price:14,color:'#A3262A',ing:'Mezcal, Campari, sweet vermouth, orange peel',glass:'rocks',specialty:true,spec:{name:'Mezcal Negroni',glass:'rocks',fill:.72,layers:[{color:'#9E1F22',portion:1}],foam:null,ice:'big',rim:null,garnishes:[{type:'citrus-peel',color:'#F08A24'}],carbonated:false,smoke:true,alcoholic:true,ingredients:'Mezcal, Campari, sweet vermouth, orange peel',description:'Smoky, bitter and bright, stirred over one big rock.'}},
   {id:'mic',name:'Michelada',price:9,color:'#B5452B',ing:'Mexican lager, lime, hot sauce, chile salt',glass:'pint'},
   {id:'rep',name:'Reposado, neat',price:10,color:'#D08A2E',ing:'1.5 oz pour, orange slice on the side',glass:'shot'},
   {id:'agu',name:'Agua de Jamaica',price:5,color:'#8E1B3A',ing:'Hibiscus, cane sugar, lime. No alcohol.',glass:'',na:true}]},
 {key:'dive',name:'The Rusty Nail',kind:'Dive bar',tagline:'Cold beer, loud jukebox, no dress code.',
  staff:['Big Mike','Rhonda','Tee'],paceMin:15,perOrder:3,feeModel:'venue',cap:150,feesThisMonth:88,
  theme:{display:"'Permanent Marker','Comic Sans MS',cursive",body:"'Archivo',system-ui,sans-serif",bg:'#E8DCC4',surface:'#F3EAD6',text:'#1F1A17',
   muted:'#6B5E50',line:'#CDBE9F',accent:'#C8201E',on:'#FFF3E0',ticket:'#C8201E',ticketInk:'#FFF3E0',radius:'2px',
   bgimg:'repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 2px,transparent 2px 5px)'},
  menu:[
   {id:'can',name:'Domestic can',price:4,color:'#C9CED3',ing:'Ice cold, your pick from the cooler',glass:'can'},
   {id:'boil',name:'Boilermaker',price:8,color:'#E2B044',ing:'Draft beer and a shot of well whiskey',glass:'pint'},
   {id:'wc',name:'Whiskey & Coke',price:7,color:'#5A2E1A',ing:'Well whiskey, Coca-Cola, lime if you ask',glass:''},
   {id:'rn',name:'Rusty Nail',price:9,color:'#B8761F',ing:'Scotch, Drambuie, one big rock',glass:'rocks'},
   {id:'vs',name:'Vodka soda',price:6,color:'#E7EEF0',ing:'Well vodka, soda, lime',glass:''},
   {id:'rb',name:'Root beer',price:3,color:'#3D1F12',ing:'Glass bottle. No alcohol.',glass:'can',na:true}]},
 {key:'roof',name:'Nineteen Up',kind:'Rooftop lounge',tagline:'Nineteen floors up. Cocktails until the skyline goes dark.',
  staff:['Nia','Theo','Ren'],paceMin:30,perOrder:2,feeModel:'patron',cap:150,feesThisMonth:140,
  theme:{display:"'Italiana',Georgia,serif",body:"'Jost',system-ui,sans-serif",bg:'#231D44',surface:'rgba(255,255,255,.08)',text:'#F6EEF2',
   muted:'#C9BCD6',line:'rgba(255,255,255,.16)',accent:'#F5C28B',on:'#231D44',ticket:'rgba(255,248,240,.95)',ticketInk:'#231D44',radius:'22px',
   bgimg:'linear-gradient(172deg,#1E1A3F 0%,#4A3268 55%,#B8697A 100%)'},
  menu:[
   {id:'f75',name:'French 75',price:15,color:'#EFE2A6',ing:'Gin, lemon, sugar, topped with brut',glass:'flute'},
   {id:'esp',name:'Espresso Martini',price:16,color:'#4A2C1C',ing:'Vodka, coffee liqueur, fresh espresso',glass:'coupe'},
   {id:'ape',name:'Aperol Spritz',price:14,color:'#F07A2E',ing:'Aperol, prosecco, soda, orange',glass:'wine'},
   {id:'sof',name:'Smoked Old Fashioned',price:18,color:'#C9822B',ing:'Bourbon, demerara, bitters, applewood smoke',glass:'rocks',specialty:true,spec:{name:'Smoked Old Fashioned',glass:'rocks',fill:.66,layers:[{color:'#B8701E',portion:1}],foam:null,ice:'big',rim:null,garnishes:[{type:'citrus-peel',color:'#F08A24'},{type:'cherry',color:'#7A0E1C'}],carbonated:false,smoke:true,alcoholic:true,ingredients:'Bourbon, demerara, bitters, applewood smoke',description:'Bourbon stirred down and finished under a cloche of applewood smoke.'}},
   {id:'ros',name:'Rosé, by the glass',price:13,color:'#F4B6B0',ing:'Provence, dry and chilled',glass:'wine'},
   {id:'yuz',name:'Yuzu Spritz',price:9,color:'#F3E27A',ing:'Yuzu, elderflower, soda. No alcohol.',glass:'flute',na:true}]}
];
const IDS=[
 {name:'Jordan Reyes',short:'Jordan R.',dob:'1998-04-12',last4:'4417'},
 {name:'Sam Whitfield',short:'Sam W.',dob:'2007-06-02',last4:'8830'}
];
const S={offset:0,vi:0,idIdx:0,step:'door',cart:{},tipPct:20,tipTo:'maker',tab:'patron',me:null,lastAlcAt:null,mine:[],nextNum:103,orders:[],checkedIn:0};
const V=()=>VENUES[S.vi];
const D=id=>V().menu.find(d=>d.id===id);
const now=()=>Date.now()+S.offset*60000;
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const m=n=>'$'+n.toFixed(2);
const me=()=>IDS[S.idIdx];
const age=p=>{const b=new Date(p.dob),n=new Date(now());let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const legal=()=>age(me())>=21;
const count=items=>items.reduce((s,i)=>s+i.qty,0);
const cartItems=()=>Object.entries(S.cart).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}));
const alcCount=items=>items.reduce((s,i)=>s+(D(i.id).na?0:i.qty),0);
const sub=items=>items.reduce((s,i)=>s+D(i.id).price*i.qty,0);

function enterVenue(i){
 S.vi=i;S.detail=null;if(typeof ING!=='undefined'&&ING.status!=='idle'){ING.status='idle';ING.spec=null}const v=V(),mn=v.menu;
 Object.assign(S,{step:'door',cart:{},tipTo:'maker',me:v.staff[0],lastAlcAt:null,mine:[],nextNum:103,checkedIn:now()-12*60000});
 S.orders=[
  {id:'o101',num:101,patron:'Dee M.',items:[{id:mn[0].id,qty:2}],subtotal:mn[0].price*2,fee:2,tip:3,tipTo:v.staff[1],status:'making',maker:v.staff[1],placedAt:now()-6*60000,sticker:false},
  {id:'o102',num:102,patron:'Chris P.',items:[{id:mn[1].id,qty:1},{id:mn[5].id,qty:1}],subtotal:mn[1].price+mn[5].price,fee:2,tip:3.4,tipTo:'maker',status:'new',maker:null,placedAt:now()-2*60000,sticker:false}];
 const t=v.theme,el=document.getElementById('patron');
 const map={display:'--t-display',body:'--t-body',bg:'--t-bg',surface:'--t-surface',text:'--t-text',muted:'--t-muted',line:'--t-line',
  accent:'--t-accent',on:'--t-on',ticket:'--t-ticket',ticketInk:'--t-ticket-ink',radius:'--t-radius',bgimg:'--t-bgimg'};
 for(const k in map)el.style.setProperty(map[k],t[k]);
 document.querySelector('[data-pane="patron"]').dataset.venue=v.key;
}

function paceBlock(){
 const v=V(),items=cartItems(),alc=alcCount(items);
 if(!alc)return null;
 if(!legal())return 'This ID is under 21. Remove alcoholic drinks to continue.';
 if(alc>v.perOrder)return `Up to ${v.perOrder} alcoholic drinks per order here.`;
 if(S.lastAlcAt&&v.paceMin>0){const next=S.lastAlcAt+v.paceMin*60000;
  if(now()<next)return `Your next alcoholic order opens at ${fmt(next)}. Non-alcoholic drinks can go through now.`}
 return null;
}
const myOrder=()=>S.orders.find(o=>o.id===S.mine[S.mine.length-1]);
const tipDest=o=>o.tipTo==='maker'?(o.maker||'whoever makes it'):o.tipTo;

function renderPatron(){
 const v=V(),p=me(),a=age(p),el=document.getElementById('patron');
 let h='';
 if(S.step==='door'){
  h=`<div class="hero"><div class="kind">${v.kind}</div><div class="vname">${v.name}</div><p>${v.tagline}</p></div>
  <h3>You're checked in</h3>
  <div class="idcard"><div class="face" aria-hidden="true"></div><div>
   <b>${p.name}</b><span class="small p-muted">License ending ${p.last4} · scanned at the door ${fmt(S.checkedIn)}</span><br>
   <span class="pill ${a>=21?'ok':'no'}">${a>=21?'21+ verified':'Under 21'}</span></div></div>
  ${a>=21?`<p class="small p-muted" style="margin-top:0">The bar sees your first name and last initial. Never your ID number.</p>`
   :`<div class="p-notice">This license can't order alcohol here. Non-alcoholic drinks are still available.</div>`}
  <div style="margin-top:auto;display:grid;gap:.7rem">
   <button class="p-btn" data-a="go" data-v="menu">See the menu</button>
   <button class="p-link small" data-a="swapId">Demo: scan a different ID</button></div>`;
 }
 else if(S.step==='menu'){
  const items=cartItems(),n=count(items),o=myOrder(),live=o&&o.status!=='done';
  h=`<h2>What are you drinking?</h2>
  ${live?`<button class="p-link small" data-a="go" data-v="ticket" style="align-self:flex-start;margin-bottom:.4rem">View ticket #${o.num}</button>`:''}
  <ul class="menu">${v.menu.map(d=>{const off=!d.na&&!legal(),q=S.cart[d.id]||0;
   return `<li class="${off?'off':''}">${d.spec?`<div class="gwrap">${drinkSVG(d.spec,{w:46,h:58})}</div>`:`<div class="glass ${d.glass} ${S.pour===d.id?'pour':''}" style="--c:${d.color}" aria-hidden="true"></div>`}
   <div><div class="name">${d.spec?`<button data-a="detail" data-v="${d.id}">${esc(d.name)}</button><span class="spec-tag">${d.specialty?'Specialty':'View'}</span>`:d.name}</div><div class="ing">${esc(d.ing)}</div><div class="price">${m(d.price)}</div></div>
   <div class="stepper">${q?`<button data-a="qty" data-v="${d.id}:-1" aria-label="Remove one ${d.name}">−</button><span>${q}</span>`:''}
   <button data-a="qty" data-v="${d.id}:1" aria-label="Add ${d.name}" ${off?'disabled':''}>+</button></div></li>`}).join('')}</ul>
  <button class="p-btn" data-a="go" data-v="checkout" ${n?'':'disabled'}>${n?`Review order · ${n} drink${n>1?'s':''} · ${m(sub(items))}`:'Add a drink to start'}</button>`;
 }
 else if(S.step==='checkout'){
  const items=cartItems(),s=sub(items),n=count(items),fee=v.feeModel==='patron'?n:0,tip=Math.round(s*S.tipPct)/100,block=paceBlock();
  h=`<button class="p-link small" data-a="go" data-v="menu" style="align-self:flex-start">Back to menu</button>
  <h2>Review order</h2>
  <div class="rows">${items.map(i=>`<div class="row"><span>${i.qty} × ${D(i.id).name}</span><span>${m(D(i.id).price*i.qty)}</span></div>`).join('')}</div>
  <h3>Tip</h3>
  <div class="p-chips">${[15,20,25].map(t=>`<button data-a="tip" data-v="${t}" aria-pressed="${S.tipPct===t}">${t}%</button>`).join('')}</div>
  <h3>Tip goes to</h3>
  <div class="p-chips"><button data-a="tipTo" data-v="maker" aria-pressed="${S.tipTo==='maker'}">Whoever makes it</button>
   ${v.staff.map(b=>`<button data-a="tipTo" data-v="${b}" aria-pressed="${S.tipTo===b}">${b}</button>`).join('')}</div>
  <div class="rows">
   <div class="row"><span>Drinks</span><span>${m(s)}</span></div>
   ${fee?`<div class="row"><span>Service fee ($1 per drink)</span><span>${m(fee)}</span></div>`:''}
   <div class="row"><span>Tip</span><span>${m(tip)}</span></div>
   <div class="row total"><span>Added to your tab</span><span>${m(s+fee+tip)}</span></div></div>
  ${block?`<div class="p-notice">${block}</div>`:''}
  <button class="p-btn" data-a="place" ${block?'disabled':''} style="margin-top:auto">Place order</button>`;
 }
 else if(S.step==='ticket'){
  const o=myOrder();
  const steps=[['new','In line'],['making',o.maker?`Being made by ${o.maker}`:'Being made'],['ready','Sealed and ready at pickup'],['done','Picked up']];
  const idx=steps.findIndex(s=>s[0]===o.status);
  const tab=S.mine.map(id=>S.orders.find(x=>x.id===id)).reduce((t,x)=>t+x.subtotal+x.fee+x.tip,0);
  h=`${o.status==='ready'?`<div class="p-notice good"><b>Your drinks are ready.</b> Head to the pickup end of the bar and show this screen.</div>`:''}
  <div class="ticket ${o.status==='ready'?'ready':''}" role="status" aria-live="polite">
   <div class="num">${v.name} · Order #${o.num}</div>
   <div class="who">${p.short}</div>
   <div>${o.items.map(i=>`${i.qty} × ${D(i.id).name}`).join('<br>')}</div>
   <div class="tear"></div>
   <ol class="steps">${steps.map((s,i)=>`<li class="${i<idx||o.status==='done'&&i===idx?'done':i===idx?'now':''}">${s[1]}</li>`).join('')}</ol>
  </div>
  <p class="small p-muted" style="margin-top:0">Your drink comes sealed with a sticker over the top. Peel it off once it's in your hand. If the seal is broken, hand it back.</p>
  <div class="row"><span>Tab so far</span><b>${m(tab)}</b></div>
  <div class="row small p-muted"><span>Tip goes to</span><span>${tipDest(o)}</span></div>
  <button class="p-btn" data-a="go" data-v="menu" style="margin-top:auto">${o.status==='done'?'Order another round':'Back to menu'}</button>`;
 }
 el.innerHTML=`<div class="p-head"><span>${fmt(now())}</span><span>${v.name}</span></div><div class="p-body" data-k="${v.key}-${S.step}">${h}</div>${S.step==='menu'?detailSheet():''}`;
}

function renderBar(){
 const v=V(),cols=[['new','New'],['making','Making'],['ready','Waiting for pickup']],el=document.getElementById('bar');
 const tips={};v.staff.forEach(b=>tips[b]=0);
 S.orders.filter(o=>o.status==='done').forEach(o=>{const d=tipDest(o);tips[d]=(tips[d]||0)+o.tip});
 el.innerHTML=`<div class="bar-head"><h2 style="margin:0">Behind the bar at ${v.name}</h2>
  <div class="chips" style="margin:0" aria-label="Signed in as">${v.staff.map(b=>`<button data-a="me" data-v="${b}" aria-pressed="${S.me===b}">${b}</button>`).join('')}</div></div>
 <div class="board">${cols.map(([k,label])=>{const list=S.orders.filter(o=>o.status===k).sort((a,b)=>a.placedAt-b.placedAt);
  return `<div class="col"><h3><span>${label}</span><span>${list.length}</span></h3>
  ${list.length?list.map(o=>`<div class="order">
   <div class="who">${o.patron}</div><div class="meta">#${o.num} · ordered ${fmt(o.placedAt)}</div>
   <ul>${o.items.map(i=>`<li>${i.qty} × ${D(i.id).name}${D(i.id).na?' (NA)':''}</li>`).join('')}</ul>
   <div class="meta">Tip ${m(o.tip)} to ${tipDest(o)}</div>
   ${k==='new'?`<button data-a="start" data-v="${o.id}">Start making</button>`:''}
   ${k==='making'?`<label><input type="checkbox" data-c="sticker" data-v="${o.id}" ${o.sticker?'checked':''}> Seal sticker applied</label>
     <button data-a="ready" data-v="${o.id}" ${o.sticker?'':'disabled'}>Mark ready</button>`:''}
   ${k==='ready'?`<div class="meta" style="margin-top:.4rem">Match the name and #${o.num} on their screen before handing off.</div>
     <button data-a="handoff" data-v="${o.id}">Handed off</button>`:''}
  </div>`).join(''):`<div class="empty">${k==='new'?'No new orders.':'Nothing here.'}</div>`}</div>`}).join('')}</div>
 <div style="margin-top:1rem"><h3>Tips tonight (picked-up orders)</h3>
  ${Object.entries(tips).map(([b,t])=>`<div class="row"><span>${b}</span><span>${m(t)}</span></div>`).join('')}</div>`;
}

function renderVenue(){
 const v=V(),t=v.theme,el=document.getElementById('venue');
 el.innerHTML=`<h2 style="margin-top:0">${v.name} settings</h2>
 <div class="venue-grid">
  <div>
   <h3>Brand theme</h3>
   <div class="swatches">${[t.bg,t.accent,t.text,t.ticket].map(c=>`<i style="background:${c}"></i>`).join('')}</div>
   <p class="small muted" style="margin-top:0">Colors, fonts, menu and staff are all this venue's. Swapping them changes the patron app without touching how ordering works.</p>
   <label class="field"><span>Minimum time between alcoholic orders</span>
    <select data-c="pace">${[0,15,30,45,60].map(x=>`<option value="${x}" ${v.paceMin===x?'selected':''}>${x?x+' minutes':'No limit'}</option>`).join('')}</select></label>
   <label class="field"><span>Alcoholic drinks per order</span>
    <select data-c="per">${[1,2,3,4].map(x=>`<option ${v.perOrder===x?'selected':''}>${x}</option>`).join('')}</select></label>
  </div>
  <div>
   <h3>Who pays the platform fee</h3>
   <div class="chips"><button data-a="fee" data-v="patron" aria-pressed="${v.feeModel==='patron'}">Patron, $1 per drink</button>
    <button data-a="fee" data-v="venue" aria-pressed="${v.feeModel==='venue'}">Venue, capped at $${v.cap}/month</button></div>
   ${v.feeModel==='venue'?`<div class="small">Venue fees this month: ${m(v.feesThisMonth)} of ${m(v.cap)}</div>
    <div class="meter"><i style="width:${Math.min(100,v.feesThisMonth/v.cap*100)}%"></i></div>
    <div class="small muted">${v.feesThisMonth>=v.cap?'Cap reached. Remaining orders this month are free for the venue.':'$1 comes off each drink sale until the cap.'}</div>`
    :`<div class="small muted">The fee shows as its own line at checkout.</div>`}
   <h3 style="margin-top:1rem">Demo controls</h3>
   <div class="chips"><button data-a="skip">Advance clock 15 min</button><button data-a="restart">Restart this venue</button><button data-a="replay">Replay arrival</button></div>
  </div>
  <div class="venue-full"><h3>Add a specialty drink from a photo</h3>${ingestPanel()}</div>
 </div>`;
}

function renderChrome(){
 const n=S.orders.filter(o=>o.status==='new').length;
 document.getElementById('venues').innerHTML=`<span>Venue</span>`+VENUES.map((v,i)=>`<button data-a="venue" data-v="${i}" aria-pressed="${S.vi===i}">${v.name}</button>`).join('');
 document.getElementById('tabs').innerHTML=[['patron','Patron'],['bar','Bar'],['venue','Venue']].map(([k,l])=>
  `<button data-a="tab" data-v="${k}" aria-pressed="${S.tab===k}">${l}${k==='bar'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');
 document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===S.tab));
 document.getElementById('clock').textContent=`Demo clock ${fmt(now())}`;
}
let lastKey='';
function render(){
 renderBar();renderVenue();renderChrome();
 const key=S.vi+S.step;
 if(key!==lastKey){renderPatron();lastKey=key}else{
  renderPatron();document.querySelector('#patron .p-body').style.animation='none'}
 S.pour=null;
}

const act={
 go:v=>{S.step=v},
 venue:v=>{enterVenue(+v);S.tab='patron';S.wantArrival=true},
 swapId:()=>{S.idIdx=(S.idIdx+1)%IDS.length;S.cart={};S.mine=[];S.lastAlcAt=null;lastKey=''},
 qty:v=>{const[id,d]=v.split(':');S.cart[id]=Math.max(0,(S.cart[id]||0)+ +d);if(+d>0)S.pour=id},
 tip:v=>{S.tipPct=+v},
 tipTo:v=>{S.tipTo=v},
 place:()=>{
  if(paceBlock())return;
  const V0=V(),items=cartItems(),s=sub(items),n=count(items),fee=V0.feeModel==='patron'?n:0;
  if(V0.feeModel==='venue')V0.feesThisMonth=Math.min(V0.cap,V0.feesThisMonth+n);
  const o={id:'o'+S.nextNum,num:S.nextNum++,patron:me().short,items,subtotal:s,fee,tip:Math.round(s*S.tipPct)/100,tipTo:S.tipTo,status:'new',maker:null,placedAt:now(),sticker:false};
  S.orders.push(o);S.mine.push(o.id);if(alcCount(items))S.lastAlcAt=now();S.cart={};S.step='ticket';
 },
 me:v=>{S.me=v},
 start:v=>{const o=S.orders.find(x=>x.id===v);o.status='making';o.maker=S.me},
 ready:v=>{const o=S.orders.find(x=>x.id===v);if(o.sticker)o.status='ready'},
 handoff:v=>{S.orders.find(x=>x.id===v).status='done'},
 fee:v=>{V().feeModel=v},
 skip:()=>{S.offset+=15},
 tab:v=>{S.tab=v},
 restart:()=>{enterVenue(S.vi);lastKey='';S.wantArrival=true},
 replay:()=>{S.tab='patron';S.wantArrival=true}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act[b.dataset.a](b.dataset.v);render();if(S.wantArrival){S.wantArrival=false;playArrival()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='sticker')S.orders.find(o=>o.id===t.dataset.v).sticker=t.checked;
 if(c==='pace')V().paceMin=+t.value;
 if(c==='per')V().perOrder=+t.value;
 if(c.startsWith('ing-'))ingChange(c,t);
 render()});

/* ---------- Drink renderer: draws a drink from a spec (glass, layers, ice, rim, garnish) ---------- */
const GLASSES={
 rocks:{top:62,bot:132,hw:t=>36-3*t,base:5},
 highball:{top:30,bot:140,hw:t=>25-2*t,base:5},
 collins:{top:22,bot:140,hw:t=>21,base:5},
 coupe:{top:52,bot:84,hw:t=>44*Math.sqrt(Math.max(0,1-t*t)),stem:[84,140]},
 martini:{top:44,bot:92,hw:t=>46*(1-t)+2,stem:[92,140]},
 flute:{top:24,bot:104,hw:t=>14-3*t*t,stem:[104,140]},
 wine:{top:36,bot:100,hw:t=>26+10*Math.sin(Math.PI*(.15+.6*t))-26*Math.pow(t,6),stem:[100,140]},
 pint:{top:26,bot:140,hw:t=>31-8*t,base:4},
 shot:{top:92,bot:140,hw:t=>20-4*t,base:6},
 mug:{top:48,bot:138,hw:t=>34+2*Math.sin(Math.PI*t),handle:true,metal:'#B87333'},
 hurricane:{top:22,bot:130,hw:t=>18+12*Math.sin(Math.PI*(.15+.85*t))-6*Math.pow(t,3),stem:[130,140]},
 tiki:{top:34,bot:140,hw:t=>27,tiki:true},
 can:{top:30,bot:140,hw:t=>25,can:true}
};
const GLASS_LIST=Object.keys(GLASSES);
const GARNISHES=['citrus-wheel','citrus-peel','cherry','olive','mint','herb','umbrella','flower','pineapple','straw','cinnamon','berry'];
const ICE=['none','cubes','big','crushed'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=(c,f)=>/^#[0-9a-f]{6}$/i.test(String(c||'').trim())?String(c).trim():f;
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);
 return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/** Clean up whatever came back from the photo reader (or a person) into a safe spec. */
function normSpec(s){
 s=s&&typeof s==='object'?s:{};
 const layers=(Array.isArray(s.layers)?s.layers:[]).slice(0,4).map(l=>({color:hex(l&&l.color,'#C9822B'),portion:Math.max(.05,Math.min(1,+(l&&l.portion)||1))}));
 if(!layers.length)layers.push({color:'#C9822B',portion:1});
 const gar=(Array.isArray(s.garnishes)?s.garnishes:[]).slice(0,4).map(g=>({type:GARNISHES.includes(g&&g.type)?g.type:null,color:hex(g&&g.color,'#F2B632')})).filter(g=>g.type);
 return {
  name:String(s.name||'House special').slice(0,40),
  glass:GLASS_LIST.includes(s.glass)?s.glass:'rocks',
  fill:Math.max(.3,Math.min(.95,+s.fill||.78)),
  layers,
  foam:s.foam&&hex(s.foam.color||s.foam,null)?{color:hex(s.foam.color||s.foam,'#F4EBD8')}:null,
  ice:ICE.includes(s.ice)?s.ice:'none',
  rim:s.rim&&hex(s.rim.color,null)?{color:hex(s.rim.color,'#ffffff')}:null,
  garnishes:gar,
  carbonated:!!s.carbonated,
  smoke:!!s.smoke,
  alcoholic:s.alcoholic!==false,
  ingredients:String(s.ingredients||'').slice(0,140),
  description:String(s.description||'').slice(0,200)
 };
}

let svgUid=0;
function drinkSVG(sp,{w=120,h=160,live=false}={}){
 const g=GLASSES[sp.glass]||GLASSES.rocks,u='d'+(++svgUid),cx=60,N=24;
 const H=g.bot-g.top,yAt=t=>g.top+H*t;
 const side=(t0,t1,dir)=>{const pts=[];for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;pts.push([cx+dir*g.hw(t),yAt(t)])}return pts};
 const shape=(t0,t1)=>{const L=side(t0,t1,-1),R=side(t1,t0,1);return 'M'+[...L,...R].map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z'};
 const vessel=shape(0,1),fillT=1-sp.fill;
 let defs=`<clipPath id="${u}v"><path d="${vessel}"/></clipPath>
  <linearGradient id="${u}sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".28" stop-color="#fff" stop-opacity=".06"/><stop offset=".7" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
  <radialGradient id="${u}gl" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
 let body='';
 // liquid layers, bottom up
 const tot=sp.layers.reduce((a,l)=>a+l.portion,0);let tb=1;
 sp.layers.forEach((l,i)=>{const share=(1-fillT)*l.portion/tot,tt=Math.max(fillT,tb-share);
  defs+=`<linearGradient id="${u}l${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(l.color,'#ffffff',.18)}"/><stop offset="1" stop-color="${mix(l.color,'#000000',.28)}"/></linearGradient>`;
  body+=`<rect x="0" y="${yAt(tt).toFixed(1)}" width="120" height="${(yAt(tb)-yAt(tt)+.6).toFixed(1)}" fill="url(#${u}l${i})"/>`;tb=tt});
 const sy=yAt(fillT),shw=g.hw(fillT);
 body+=`<ellipse cx="${cx}" cy="${sy.toFixed(1)}" rx="${shw.toFixed(1)}" ry="${(shw*.12+1).toFixed(1)}" fill="${mix(sp.layers[sp.layers.length-1].color,'#ffffff',.35)}" opacity=".85"/>`;
 if(sp.foam){const fy=sy;body+=`<rect x="0" y="${(fy-2).toFixed(1)}" width="120" height="${(Math.min(14,H*.16)).toFixed(1)}" fill="${sp.foam.color}"/>
  <path d="M${cx-shw},${fy-1} q${shw/4},-5 ${shw/2},0 t${shw/2},0 t${shw/2},0 t${shw/2},0" fill="${sp.foam.color}"/>`}
 // ice
 const rnd=(n=>()=>(n=(n*9301+49297)%233280)/233280)(sp.name.length*7+sp.glass.length);
 if(sp.ice==='cubes'){for(let i=0;i<4;i++){const s=Math.min(22,shw*.55),x=cx-shw*.6+rnd()*shw*1.2-s/2,y=sy-s*.35+i*s*.62+rnd()*4;
  body+=`<g class="ice" style="animation-delay:${-i*.7}s"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="3" transform="rotate(${(rnd()*30-15).toFixed(0)} ${(x+s/2).toFixed(0)} ${(y+s/2).toFixed(0)})" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".6"/></g>`}}
 if(sp.ice==='big'){const s=Math.min(42,shw*1.3);body+=`<g class="ice"><rect x="${cx-s/2}" y="${(sy-s*.25).toFixed(1)}" width="${s}" height="${s}" rx="4" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".65"/></g>`}
 if(sp.ice==='crushed'){for(let i=0;i<34;i++){const x=cx-shw+rnd()*shw*2,y=sy-3+rnd()*H*.45,s=3+rnd()*5;
  body+=`<path d="M${x.toFixed(1)},${y.toFixed(1)}l${s},${-s*.4}l${s*.3},${s}l${-s},${s*.3}z" fill="#fff" fill-opacity=".5"/>`}}
 if(sp.carbonated){for(let i=0;i<9;i++){const x=cx-shw*.7+rnd()*shw*1.4;
  body+=`<circle class="bub" cx="${x.toFixed(1)}" cy="${(g.bot-4).toFixed(1)}" r="${(1+rnd()*1.4).toFixed(1)}" fill="#fff" fill-opacity=".7" style="--rise:${(sy-g.bot+6).toFixed(0)}px;animation-delay:${(-rnd()*2.4).toFixed(2)}s"/>`}}
 // vessel: tint, liquid, shading, outline
 const wall=g.metal||(g.tiki?'#7A4A2A':null);
 let out=`<defs>${defs}</defs>`;
 if(g.stem){const[a,b]=g.stem;out+=`<path d="M${cx-2.5},${a} L${cx-2},${b-3} L${cx-22},${b} L${cx+22},${b} L${cx+2},${b-3} L${cx+2.5},${a}Z" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>`}
 if(g.handle)out+=`<path d="M${cx+36},64 c22,0 22,52 0,52" fill="none" stroke="${g.metal}" stroke-width="7" stroke-linecap="round"/>`;
 out+=`<path d="${vessel}" fill="${wall||'#fff'}" fill-opacity="${wall?1:.07}"/>`;
 if(!wall&&!g.can)out+=`<g clip-path="url(#${u}v)">${body}</g>`;
 out+=`<path d="${vessel}" fill="url(#${u}sh)"/><path d="${vessel}" fill="url(#${u}gl)"/>`;
 if(wall){out+=`<path d="${vessel}" fill="${mix(wall,'#000000',.15)}" fill-opacity=".25"/>`;
  if(g.tiki)out+=`<g fill="${mix(wall,'#000000',.45)}"><rect x="${cx-16}" y="70" width="11" height="7" rx="2"/><rect x="${cx+5}" y="70" width="11" height="7" rx="2"/><rect x="${cx-12}" y="98" width="24" height="9" rx="2"/></g>`}
 if(g.can)out+=`<rect x="${cx-25}" y="${g.top}" width="50" height="${H}" rx="6" fill="${sp.layers[0].color}"/><path d="${vessel}" fill="url(#${u}sh)"/><rect x="${cx-25}" y="70" width="50" height="22" fill="#fff" fill-opacity=".85"/>`;
 out+=`<path d="${vessel}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.3"/>`;
 out+=`<path d="M${(cx-g.hw(.05)+5).toFixed(1)},${(yAt(.06)).toFixed(1)} L${(cx-g.hw(.8)+5).toFixed(1)},${yAt(.8).toFixed(1)}" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>`;
 if(g.base)out+=`<rect x="${cx-g.hw(1)}" y="${g.bot-g.base}" width="${2*g.hw(1)}" height="${g.base}" fill="#fff" fill-opacity=".25"/>`;
 if(sp.rim){const hw=g.hw(0);for(let i=0;i<22;i++){const x=cx-hw+2*hw*i/21;out+=`<circle cx="${x.toFixed(1)}" cy="${(g.top+1.5+(i%3)*.8).toFixed(1)}" r="1.6" fill="${sp.rim.color}"/>`}}
 // garnishes perched on the rim
 const rx=cx+g.hw(0)-4,ry=g.top;
 sp.garnishes.forEach((ga,i)=>{const c=ga.color,ox=-i*13;
  switch(ga.type){
   case'citrus-wheel':out+=`<g transform="translate(${rx+ox+4},${ry-6})"><circle r="13" fill="${mix(c,'#ffffff',.55)}" stroke="${c}" stroke-width="3"/>${[0,60,120].map(a=>`<line x1="0" y1="0" x2="${(11*Math.cos(a*Math.PI/180)).toFixed(1)}" y2="${(11*Math.sin(a*Math.PI/180)).toFixed(1)}" stroke="${c}" stroke-width="1.2"/><line x1="0" y1="0" x2="${(-11*Math.cos(a*Math.PI/180)).toFixed(1)}" y2="${(-11*Math.sin(a*Math.PI/180)).toFixed(1)}" stroke="${c}" stroke-width="1.2"/>`).join('')}</g>`;break;
   case'citrus-peel':out+=`<path d="M${rx+ox-6},${ry+4} c10,-18 18,-4 10,-16 c-6,-10 8,-14 12,-6" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`;break;
   case'cherry':out+=`<path d="M${rx+ox},${ry-4} q4,-16 12,-20" fill="none" stroke="#3b6b2a" stroke-width="1.6"/><circle cx="${rx+ox}" cy="${ry-1}" r="6.5" fill="${c}"/><circle cx="${rx+ox-2}" cy="${ry-3}" r="1.8" fill="#fff" fill-opacity=".7"/>`;break;
   case'olive':out+=`<line x1="${rx+ox-20}" y1="${ry+30}" x2="${rx+ox+10}" y2="${ry-22}" stroke="#d9b98a" stroke-width="1.8"/><ellipse cx="${rx+ox-6}" cy="${ry+6}" rx="6" ry="8" transform="rotate(-30 ${rx+ox-6} ${ry+6})" fill="${c}"/><circle cx="${rx+ox-5}" cy="${ry+4}" r="2" fill="#c0392b"/>`;break;
   case'mint':case'herb':out+=`<g fill="${c}">${[[-6,-10,-30],[4,-16,10],[-2,-22,-5],[8,-8,35]].map(([x,y,r])=>`<ellipse cx="${cx+x+ox/2}" cy="${ry+y}" rx="4.5" ry="9" transform="rotate(${r} ${cx+x+ox/2} ${ry+y})"/>`).join('')}</g><line x1="${cx+ox/2}" y1="${ry+4}" x2="${cx+ox/2}" y2="${ry-18}" stroke="${mix(c,'#000000',.3)}" stroke-width="1.5"/>`;break;
   case'umbrella':out+=`<line x1="${rx+ox-10}" y1="${ry+14}" x2="${rx+ox+6}" y2="${ry-24}" stroke="#d9b98a" stroke-width="1.6"/><path d="M${rx+ox-12},${ry-22} Q${rx+ox+6},${ry-44} ${rx+ox+24},${ry-26} Z" fill="${c}"/><path d="M${rx+ox-12},${ry-22} L${rx+ox+6},${ry-24} L${rx+ox+24},${ry-26}" fill="none" stroke="#fff" stroke-opacity=".5"/>`;break;
   case'flower':out+=`<g transform="translate(${rx+ox},${ry-8})">${[0,72,144,216,288].map(a=>`<ellipse rx="4" ry="8" transform="rotate(${a}) translate(0,-6)" fill="${c}"/>`).join('')}<circle r="3.2" fill="#F2D24B"/></g>`;break;
   case'pineapple':out+=`<path d="M${rx+ox-10},${ry+2} L${rx+ox+12},${ry+2} L${rx+ox+1},${ry-18}Z" fill="${c}"/><path d="M${rx+ox-3},${ry-16} l-6,-12 M${rx+ox+1},${ry-18} l0,-14 M${rx+ox+5},${ry-16} l6,-12" stroke="#3f8f3a" stroke-width="3" stroke-linecap="round"/>`;break;
   case'straw':out+=`<line x1="${cx-6+ox/3}" y1="${g.bot-12}" x2="${cx+18+ox/3}" y2="${ry-28}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;break;
   case'cinnamon':out+=`<rect x="${rx+ox-14}" y="${ry-30}" width="6" height="44" rx="2" transform="rotate(20 ${rx+ox-11} ${ry-8})" fill="${c}"/>`;break;
   case'berry':out+=`${[[0,0],[7,-3],[3,-8]].map(([x,y])=>`<circle cx="${rx+ox+x}" cy="${ry-4+y}" r="4.2" fill="${c}"/>`).join('')}`;break;
  }});
 if(sp.smoke)out+=`<g class="smoke" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5">${[-10,4,16].map((x,i)=>`<path style="animation-delay:${-i*1.1}s" d="M${cx+x},${g.top-2} c-8,-10 8,-18 0,-28 c-8,-10 8,-16 2,-26"/>`).join('')}</g>`;
 return `<svg viewBox="-6 -22 132 166" width="${w}" height="${h}" aria-hidden="true" class="drink-svg${live?' live':''}">${out}</svg>`;
}

/* ---------- Photo ingest: a venue photographs a specialty drink, Claude reads it into a spec ---------- */
const EXAMPLE_SPEC={name:'Blue Lagoon Hurricane',glass:'hurricane',fill:.86,layers:[{color:'#F2B632',portion:.35},{color:'#1FA3C8',portion:.65}],foam:null,ice:'crushed',rim:null,
 garnishes:[{type:'pineapple',color:'#F2C94C'},{type:'umbrella',color:'#F25F8B'},{type:'cherry',color:'#C0182A'}],carbonated:false,smoke:false,alcoholic:true,
 ingredients:'Light rum, blue curaçao, pineapple, lime, orgeat',description:'Tropical layered rum punch, pineapple and cherry on top.'};
const INGEST_PROMPT=`You are looking at a photo of one cocktail or drink as served at a bar. Describe how it LOOKS so an app can draw a stylized illustration of it.
Reply with only one JSON object of this shape:
{"name": string (short menu-style name if obvious, else a descriptive name),
 "glass": one of ${JSON.stringify(GLASS_LIST)},
 "fill": number 0.3-0.95 (how full the glass is),
 "layers": [{"color": "#RRGGBB", "portion": number}] bottom layer first, 1-4 entries, portions relative,
 "foam": null or {"color": "#RRGGBB"},
 "ice": one of ${JSON.stringify(ICE)},
 "rim": null or {"color": "#RRGGBB"} (salt, sugar or spice on the rim),
 "garnishes": [{"type": one of ${JSON.stringify(GARNISHES)}, "color": "#RRGGBB"}] up to 3, most visible first,
 "carbonated": boolean, "smoke": boolean,
 "alcoholic": boolean (best guess; true unless it clearly looks like a soft drink),
 "ingredients": string, a short plausible comma-separated list,
 "description": string, one appetizing sentence}
Pick colors from the actual drink in the photo. If the photo is not a drink, reply {"error":"not a drink"}.`;

let sampleFn=null;
(async()=>{try{if(window.claude&&claude.use){const s=await claude.use('sample');if(s){const lim=await s.limits().catch(()=>null);if(lim&&lim.images){sampleFn=s;render()}}}}catch(e){}})();

const ING={file:null,url:null,status:'idle',spec:null,err:'',price:14,ctl:null};
function ingReset(){if(ING.ctl)ING.ctl.abort();Object.assign(ING,{file:null,status:'idle',spec:null,err:'',price:14,ctl:null})}
async function ingAnalyze(){
 if(!sampleFn||!ING.file)return;
 ING.status='thinking';ING.err='';ING.ctl=new AbortController();render();
 try{
  const r=await sampleFn.json(INGEST_PROMPT,{images:[ING.file],signal:ING.ctl.signal});
  if(r&&r.error){ING.status='error';ING.err="That photo doesn't look like a drink. Try a closer shot of the glass."}
  else{ING.spec=normSpec(r);ING.status='review'}
 }catch(e){
  if(e&&e.code==='cancelled'){ING.status='idle'}
  else{ING.status='error';ING.err={not_granted:'Photo reading was not allowed. You can still build the drink by hand with "Start from example".',
   rate_limited:'Too many requests right now. Try again in a minute.',image_rejected:'That image could not be read. Try a JPEG or PNG under 20 MB.',
   invalid_json:'The read came back garbled. Tap Analyze to try again.',refused:'That photo could not be processed. Try a different one.'}[e&&e.code]||'Something went wrong reading the photo. Try again.';
   if(e&&['not_granted','sampling_disabled','images_unavailable','capability_disabled'].includes(e.code))sampleFn=null}
 }
 ING.ctl=null;render();
}
function ingestPanel(){

   <div class="ing-compare">
    ${ING.url?`<figure><img src="${ING.url}" alt="Photo of the drink"><figcaption>Photo</figcaption></figure>`:''}

   ${field('Name',`<input data-c="ing-name" value="${esc(sp.name)}" maxlength="40">`)}

   <div class="field"><span>Layers (bottom to top)</span><div class="ing-swatches">
    ${sp.layers.map((l,i)=>`<input type="color" data-c="ing-layer" data-i="${i}" value="${l.color}" aria-label="Layer ${i+1} color">`).join('')}
    ${sp.layers.length<4?`<button class="ghost small" data-a="ingLayer" data-v="add">+ layer</button>`:''}${sp.layers.length>1?`<button class="ghost small" data-a="ingLayer" data-v="del">− layer</button>`:''}</div></div>
   <div class="field"><span>Garnish</span><div class="chips" style="margin:0">${GARNISHES.map(gn=>`<button data-a="ingGar" data-v="${gn}" aria-pressed="${sp.garnishes.some(x=>x.type===gn)}">${gn.replace('-',' ')}</button>`).join('')}</div></div>
   <div class="chips"><button data-a="ingFlag" data-v="carbonated" aria-pressed="${sp.carbonated}">Bubbles</button><button data-a="ingFlag" data-v="smoke" aria-pressed="${sp.smoke}">Smoke</button>
    <button data-a="ingFlag" data-v="rim" aria-pressed="${!!sp.rim}">Rim</button><button data-a="ingFlag" data-v="foam" aria-pressed="${!!sp.foam}">Foam</button><button data-a="ingFlag" data-v="alcoholic" aria-pressed="${!sp.alcoholic}">Non-alcoholic</button></div>
   ${field('Ingredients shown to patrons',`<input data-c="ing-ingr" value="${esc(sp.ingredients)}" maxlength="140">`)}
   <p class="small muted" style="margin-top:0">Check the ingredients. The photo reader guesses them from how the drink looks.</p>
   <div class="chips"><button class="primary-chip" data-a="ingAdd">Add to ${esc(V().name)} menu</button><button data-a="ingCancel">Cancel</button></div>
  </div>`;
 }
 return `<div class="ingest">
  <p class="small muted" style="margin-top:0">Snap a photo of a specialty drink as you serve it. The app reads the glass, colors, ice and garnish and builds the menu graphic, which you can adjust before it goes live.</p>
  ${ING.url?`<img class="ing-thumb" src="${ING.url}" alt="Selected drink photo">`:''}
  <div class="chips">
   <label class="filebtn">${ING.url?'Choose a different photo':'Choose a photo'}<input type="file" accept="image/jpeg,image/png,image/webp" data-c="ing-file" hidden></label>
   ${ING.file&&sampleFn?`<button class="primary-chip" data-a="ingRun" ${ING.status==='thinking'?'disabled':''}>${ING.status==='thinking'?'Reading the photo…':'Analyze photo'}</button>`:''}
   ${ING.status==='thinking'?`<button data-a="ingStop">Stop</button>`:''}
   <button data-a="ingExample">Start from example</button>
  </div>
  ${ING.file&&!sampleFn?`<p class="small muted">Automatic photo reading isn't available in this view. Use "Start from example" and match it to your photo by hand.</p>`:''}
  ${ING.status==='error'?`<div class="notice">${esc(ING.err)}</div>`:''}
 </div>`;
}
function ingChange(c,t){
 const sp=ING.spec;
 if(c==='ing-file'){const f=t.files&&t.files[0];if(!f)return;if(ING.url)URL.revokeObjectURL(ING.url);ingReset();ING.file=f;ING.url=URL.createObjectURL(f);return}
 if(!sp)return;
 if(c==='ing-name')sp.name=t.value.slice(0,40)||'House special';
 if(c==='ing-price')ING.price=Math.max(1,Math.round(+t.value||ING.price));
 if(c==='ing-glass')sp.glass=t.value;
 if(c==='ing-ice')sp.ice=t.value;
 if(c==='ing-layer')sp.layers[+t.dataset.i].color=hex(t.value,'#C9822B');
 if(c==='ing-ingr')sp.ingredients=t.value.slice(0,140);
}
Object.assign(act,{
 ingRun:()=>{ingAnalyze()},
 ingStop:()=>{if(ING.ctl)ING.ctl.abort()},

let threeP=null;
function loadThree(){
 if(window.THREE)return Promise.resolve();
 if(!threeP)threeP=new Promise((res,rej)=>{const sc=document.createElement('script');
  sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
 return threeP;
}
function webglOK(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){return false}}
const clamp01=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp01(x),3);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);return t}

function glowSpriteTex(){
 return canvasTex(64,64,(g,w,h)=>{
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(.25,'rgba(255,235,190,.85)');
  gr.addColorStop(.6,'rgba(255,180,90,.25)');
  gr.addColorStop(1,'rgba(255,140,40,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
 });
}

    scene.add(spire);

    const beacon=new THREE.Sprite(new THREE.SpriteMaterial({
     map:glowSpriteTex(),color:'#ff3b5c',transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false
    }));
    beacon.position.set(bx,h+spireH,bz);
    beacon.scale.set(.85,.85,1);
    scene.add(beacon);
    beacons.push({beacon,phase:Math.random()*6.28});
   }
  }

  // Reflective dark avenue grid on the ground plane
  const roadTex=canvasTex(256,256,(g,w,h)=>{
   g.fillStyle='#0c091c';g.fillRect(0,0,w,h);
   g.strokeStyle='rgba(255,195,120,.16)';g.lineWidth=3;
   g.strokeRect(2,2,w-4,h-4);
   g.strokeStyle='rgba(140,180,255,.1)';g.lineWidth=1;
   g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
  });
  roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping;roadTex.repeat.set(24,24);
  const ground=new THREE.Mesh(
   new THREE.PlaneGeometry(220,220),
   new THREE.MeshStandardMaterial({map:roadTex,roughness:.35,metalness:.5})
  );
  ground.rotation.x=-Math.PI/2;scene.add(ground);

  // Glowing starfield with soft circular star sprites
  const sg=new THREE.BufferGeometry(),pos=[];
  for(let i=0;i<650;i++){
   pos.push((Math.random()-.5)*170, 22+Math.random()*58, -55-Math.random()*35);
  }
  sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const sm=new THREE.PointsMaterial({
   map:glowSpriteTex(),color:0xfff6e5,size:.55,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false
  });
  scene.add(new THREE.Points(sg,sm));

  return t=>{
   blds.forEach(b=>b.material.emissiveIntensity=clamp01((t-b.userData.delay)*1.8)*1.15);
   beacons.forEach(({beacon,phase})=>{
    const blink=Math.max(0,Math.sin(t*4.5+phase));
    beacon.material.opacity=clamp01((t-1.0)/1.5)*(blink*blink)*.95;
   });
   sm.opacity=clamp01((t-1.4)/2.2)*.95;
   const k=ease(t/4.7),y=1.4+k*14.5;
   camera.position.set(Math.sin(t*.28)*2.2, y, 10.5-k*1.8);
   camera.lookAt(0, y*.6, -32);
  };
 }
};

let arrivalRun=null;
async function playArrival(){
 const el=document.getElementById('arrival');
 if(arrivalRun)arrivalRun.stop(true);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches||!webglOK())return;
 try{await loadThree()}catch(e){return}
 const v=V();el.hidden=false;el.className='arrival';el.dataset.aVenue=v.key;
 el.innerHTML=`<button class="a-skip" type="button">Skip</button><div class="a-text"><div class="a-kind">${v.kind}</div><div class="a-name" style="font-family:${v.theme.display}">${v.name}</div></div>`;
 const w=el.clientWidth,h=el.clientHeight;
 if(!w||!h){el.hidden=true;el.innerHTML='';return}
 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(w,h,false);
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 el.prepend(renderer.domElement);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,w/h,.1,250);
 const update=SCENES[v.key](scene,camera);
 const text=el.querySelector('.a-text'),t0=performance.now(),DUR=5000;
 let raf,stopped=false;
 const stop=immediate=>{
  if(stopped)return;stopped=true;cancelAnimationFrame(raf);arrivalRun=null;el.classList.add('out');
  setTimeout(()=>{
   scene.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material)[].concat(o.material).forEach(m=>{['map','emissiveMap','bumpMap'].forEach(k=>m[k]&&m[k].dispose());m.dispose()});
   });
   if(scene.background&&scene.background.dispose)scene.background.dispose();
   renderer.dispose();try{renderer.forceContextLoss()}catch(e){}
   if(!arrivalRun){el.hidden=true;el.innerHTML='';el.className='arrival'}
  },immediate?0:650);
 };
 el.querySelector('.a-skip').addEventListener('click',()=>stop());
 arrivalRun={stop};
 const frame=now=>{const t=(now-t0)/1000;update(t);renderer.render(scene,camera);
  if(t>1.1)text.classList.add('show');
  if(now-t0>DUR){stop();return}raf=requestAnimationFrame(frame)};
 raf=requestAnimationFrame(frame);
}

enterVenue(0);render();playArrival();
</script>
